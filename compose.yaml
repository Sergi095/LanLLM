name: lanllm

x-common: &common
  image: lanllm:local
  build: .
  network_mode: host
  ipc: host
  devices:
    - nvidia.com/gpu=all
  restart: unless-stopped
  environment:
    NODE_IP: ${NODE_IP:?Set NODE_IP in .env}
    HEAD_IP: ${HEAD_IP:?Set HEAD_IP in .env}
    NETWORK_INTERFACE: ${NETWORK_INTERFACE:?Set NETWORK_INTERFACE in .env}
    LOCAL_GPUS: ${LOCAL_GPUS:?Set LOCAL_GPUS in .env}
    TOTAL_GPUS: ${TOTAL_GPUS:-3}
    MODEL_ID: ${MODEL_ID:?Set MODEL_ID in .env}
    RAY_PORT: ${RAY_PORT:-6379}
    API_HOST: ${API_HOST:-127.0.0.1}
    API_PORT: ${API_PORT:-8000}
    MAX_MODEL_LEN: ${MAX_MODEL_LEN:-1024}
    GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.7}
    ATTENTION_BACKEND: ${ATTENTION_BACKEND:-FLASH_ATTN}
    ENFORCE_EAGER: ${ENFORCE_EAGER:-1}
    HF_TOKEN: ${HF_TOKEN:-}
    HF_REVISION: ${HF_REVISION:-}
    QUANTIZATION: ${QUANTIZATION:-}
    DTYPE: ${DTYPE:-}
    LAYER_PARTITION: ${LAYER_PARTITION:-}
    TRUST_REMOTE_CODE: ${TRUST_REMOTE_CODE:-0}
    POOL_WAIT_TIMEOUT: ${POOL_WAIT_TIMEOUT:-600}
  volumes:
    - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    - ${HOME}/.cache/vllm:/root/.cache/vllm

services:
  head:
    <<: *common
    profiles: [head]
    command: [head]

  worker:
    <<: *common
    profiles: [worker]
    command: [worker]
